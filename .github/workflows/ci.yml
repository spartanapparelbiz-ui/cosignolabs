name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit (fail on critical)
        run: npm audit --audit-level=critical
      - name: Build + bundle secret scan
        run: npm run build
      - name: Tests (acceptance + security suite)
        run: npm test
